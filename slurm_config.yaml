# =============================================================================
# SLURM cluster profile for Snakemake
# Place this file at: ~/.config/snakemake/slurm/config.yaml
# Then run pipeline with: snakemake --profile slurm
# =============================================================================

executor: slurm
jobs: 20                        # max parallel jobs in the queue
latency-wait: 60                # seconds to wait for output files after job ends
rerun-incomplete: true
printshellcmds: true

default-resources:
  slurm_partition: "qn"    # <-- change to your partition name
  mem_mb: 8000
  runtime: 120                         # minutes
  threads: 1

set-resources:
  star_genome_index:
    mem_mb: 40000
    runtime: 120
    threads: 16
  star_map:
    mem_mb: 40000
    runtime: 180
    threads: 16
  trim_galore:
    mem_mb: 8000
    runtime: 120
    threads: 4
  trinity_assembly:
    mem_mb: 120000
    runtime: 1440
    threads: 16
  diamond_blastx:
    mem_mb: 32000
    runtime: 480
    threads: 16
  kraken2:
    mem_mb: 80000
    runtime: 120
    threads: 16
  map_rrna:
    mem_mb: 16000
    runtime: 60
    threads: 8
  map_accessions_to_taxid:
    mem_mb: 16000
    runtime: 60
    threads: 4
